name: Alertas del Observatorio de Desempleo
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datos-alertas-desempleo
  cancel-in-progress: false
jobs:
  notificar-edicion-publicada:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/datos/enviar-alertas-desempleo.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}
          SES_SMTP_HOST: ${{ vars.SES_SMTP_HOST }}
          SES_SMTP_PORT: ${{ vars.SES_SMTP_PORT }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
          SES_FROM_NAME: ${{ vars.SES_FROM_NAME }}
