name: Actualizar datos de desempleo
on:
  workflow_dispatch:
    inputs:
      redesplegar:
        description: Volver a desplegar main aunque el INE no tenga datos nuevos
        type: boolean
        default: false
  schedule:
    # El INE publica a las 09:00. Consultar cada 15 minutos durante las dos primeras horas.
    - cron: '7,22,37,52 9-10 25-31,1-3 * *'
      timezone: America/Santiago
    - cron: '17 12,16 25-31,1-3 * *'
      timezone: America/Santiago
permissions:
  contents: write
  issues: write
concurrency:
  group: datos-desempleo
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Descargar, validar y generar
        id: datos
        env:
          BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
          DATOS_SUMMARY_PATH: datos-desempleo-resumen.md
        run: |
          set -o pipefail
          node scripts/datos/update-desempleo.mjs 2>&1 | tee datos-desempleo-log.txt
          if [ -n "$(git status --porcelain -- data/desempleo public/datos/desempleo)" ]; then
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          fi
      # The series are imported as typed JSON, so a type check catches structural changes before publishing.
      - name: Verificar tipos antes de publicar
        id: tipos
        if: steps.datos.outputs.cambios == 'true'
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee -a datos-desempleo-log.txt
      - name: Verificar conexión con Vercel
        if: steps.datos.outputs.cambios == 'true' || inputs.redesplegar
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo 'Falta el secreto VERCEL_DEPLOY_HOOK' | tee -a datos-desempleo-log.txt
            exit 1
          fi
      - name: Publicar en main
        id: publicar
        if: steps.datos.outputs.cambios == 'true'
        run: |
          periodo=$(node -p "require('./data/desempleo/meta.json').ultimo_periodo.label")
          fecha=$(node -p "require('./data/desempleo/meta.json').ine_fecha_actualizacion")
          if [ -s datos-desempleo-resumen.md ]; then
            titulo="datos(desempleo): actualiza el observatorio a ${periodo} (INE ${fecha})"
          else
            titulo="datos(desempleo): actualiza cuadros complementarios del INE"
            sed -n '/^Fase 2:/p' datos-desempleo-log.txt > datos-desempleo-resumen.md
          fi
          { echo "$titulo"; echo; cat datos-desempleo-resumen.md; } > /tmp/mensaje-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/desempleo/*.json data/desempleo/regiones/*.json public/datos/desempleo
          git commit -q -F /tmp/mensaje-commit.txt
          for intento in 1 2 3; do
            if ! git pull --rebase -q origin main; then
              git rebase --abort 2>/dev/null || true
              echo 'No se pudo integrar el main actual; se volverá a intentar en la próxima ejecución' | tee -a datos-desempleo-log.txt
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 10))
          done
          echo "No se pudo publicar en main tras 3 intentos" | tee -a datos-desempleo-log.txt
          exit 1
      - name: Desplegar en Vercel
        if: steps.publicar.outcome == 'success' || inputs.redesplegar
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            --request POST --output /dev/null "$VERCEL_DEPLOY_HOOK" 2>&1 | tee -a datos-desempleo-log.txt
      - name: Informar fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf 'Falló la actualización automática del observatorio de desempleo. Revisar la ejecución: %s/%s/actions/runs/%s\n\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; tail -n 60 datos-desempleo-log.txt 2>/dev/null; printf '\n```\n'; } > /tmp/datos-issue.md
          gh issue create --title 'Falló la actualización de datos de desempleo' --body-file /tmp/datos-issue.md
