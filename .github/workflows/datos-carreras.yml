name: Actualizar Datos de Carreras (mifuturo.cl e IPC)

on:
  workflow_dispatch:
  schedule:
    # Semanal los lunes a las 11:00 CLT (14:00 UTC) en diciembre y enero (temporada PAES / nueva edición)
    - cron: "0 14 * 12,1 1"
    # Mensual el día 10 a las 11:00 CLT para actualizar el IPC del Banco Central
    - cron: "0 14 10 * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-carreras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run carreras data pipeline
        id: pipeline
        env:
          BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
        run: |
          node scripts/datos/update-carreras.mjs | tee /tmp/carreras-summary.md
          echo "edition=$(node -e "console.log(require('./data/carreras/meta.json').edicion)")" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request on changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "datos(carreras): actualización automática (${{ steps.pipeline.outputs.edition }})"
          branch: "datos/carreras-${{ steps.pipeline.outputs.edition }}-${{ steps.pipeline.outputs.date }}"
          title: "Datos de Carreras: actualización automática (${{ steps.pipeline.outputs.edition }})"
          body-path: /tmp/carreras-summary.md
          labels: |
            datos
            automated

      - name: Open issue on validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Error en actualización automática de Datos de Carreras (${new Date().toISOString().slice(0, 10)})`,
              body: `El workflow \`datos-carreras.yml\` falló en la ejecución ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\nRevisa los logs de validación (posible cambio de formato en mifuturo.cl o falla de pruebas de humo).`,
              labels: ["datos", "bug"]
            });
